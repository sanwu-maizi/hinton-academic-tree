<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hinton 学术谱系</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#24312f;background:#f4f7f6}header{height:64px;display:flex;align-items:center;gap:16px;padding:12px 20px;background:white;border-bottom:1px solid #cdd8d3}h1{font-size:19px;margin:0}input,select,button{padding:8px;border:1px solid #cdd8d3;background:white;border-radius:4px}main{display:flex;height:calc(100vh - 64px)}svg{flex:1;min-width:0;cursor:grab}aside{width:370px;overflow:auto;background:white;border-left:1px solid #cdd8d3;padding:20px}circle{cursor:pointer;stroke:white;stroke-width:2}text{font-size:12px;pointer-events:none}path{stroke:#a6b4b0;fill:none}article{padding:12px 0;border-top:1px solid #ddd}small{color:#61746a}.tabs{display:flex;gap:6px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#176e61}@media(max-width:750px){header{height:auto;flex-wrap:wrap}main{height:85vh;flex-direction:column}svg{min-height:50vh}aside{width:100%;max-height:35vh}}</style>
<header><h1>Hinton 学术谱系</h1><input id="search" placeholder="搜索作者"><button id="reset">⌂</button><small id="count"></small></header><main><svg id="svg"><g id="canvas"></g></svg><aside id="panel"></aside></main>
<script>const D=__DATA__;const NS='http://www.w3.org/2000/svg',svg=document.querySelector('svg'),canvas=document.querySelector('#canvas'),panel=document.querySelector('#panel');const works=new Map(D.works.map(w=>[w.work_id,w])),authors=new Map(D.authors.map(a=>[a.node_id,a]));function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(tag,attrs,parent=canvas){let x=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));parent.appendChild(x);return x}let groups={},positions={},selected='computerscience:1446',offset={x:0,y:0,k:.5};D.nodes.forEach(n=>(groups[n.generation]??=[]).push(n));Object.entries(groups).forEach(([g,ns])=>ns.forEach((n,i)=>positions[n.id]={x:Number(g)*320,y:(i-(ns.length-1)/2)*110}));let maxC=Math.max(1,...D.authors.map(a=>a.works.reduce((s,id)=>s+(works.get(id)?.cited_by_count||0),0)));D.edges.forEach(e=>{let a=positions[e.source_id],b=positions[e.target_id];if(a&&b)el('path',{d:`M${a.x},${a.y} C${a.x+150},${a.y} ${b.x-150},${b.y} ${b.x},${b.y}`})});D.nodes.forEach(n=>{let a=authors.get(n.id),ids=a?.works||[],c=ids.reduce((s,id)=>s+(works.get(id)?.cited_by_count||0),0),p=positions[n.id],g=el('g',{'data-id':n.id}),r=9+Math.log1p(ids.length)*3;el('circle',{cx:p.x,cy:p.y,r,fill:a?.match_status==='matched'?`hsl(155 48% ${82-52*Math.log1p(c)/Math.log1p(maxC)}%)`:'#d7dad9'},g);el('text',{x:p.x+ r+7,y:p.y+4},g).textContent=n.name;g.onclick=()=>show(n.id);el('title',{},g).textContent=`${n.name} | ${ids.length}篇 | ${c}次引用`});function transform(){canvas.setAttribute('transform',`translate(${offset.x},${offset.y}) scale(${offset.k})`)}function center(id){let p=positions[id];offset.x=svg.clientWidth/2-p.x*offset.k;offset.y=svg.clientHeight/2-p.y*offset.k;transform()}function show(id){selected=id;let n=D.nodes.find(n=>n.id===id),a=authors.get(id),ws=(a?.works||[]).map(id=>works.get(id)).filter(Boolean);panel.innerHTML=`<h2>${esc(n.name)}</h2><p>${esc(n.institution||'机构未记录')}</p><p>${esc(n.tree)} · ${esc(a?.match_status||'未处理')}</p><p>已获取 ${ws.length} 篇 · 被引 ${ws.reduce((s,w)=>s+(w.cited_by_count||0),0)} 次</p><small>分页：${esc(a?.pagination_status||'未开始')}；谱系关系为网站培训关系，未全部核实为博士指导。</small><p><a href="${esc(n.url)}" target="_blank" rel="noopener">AcademicTree 来源</a></p><div class="tabs"><input id="year" type="number" placeholder="年份" style="width:100px"><select id="sort"><option value="cites">引用排序</option><option value="year">年份排序</option></select><button id="raw">全部字段</button></div><div id="list"></div>`;function list(){let year=document.querySelector('#year').value,sort=document.querySelector('#sort').value;document.querySelector('#list').innerHTML=ws.filter(w=>!year||String(w.publication_year)===year).sort((a,b)=>sort==='cites'?(b.cited_by_count||0)-(a.cited_by_count||0):(b.publication_year||0)-(a.publication_year||0)).map(w=>`<article><b>${esc(w.title)}</b><p>${esc(w.publication_year)} · 被引 ${w.cited_by_count||0}</p><small>${esc((w.authors||[]).join(', '))}</small><p>${esc(w.venue||'')}</p><details><summary>论文全部字段</summary><pre>${esc(JSON.stringify(w,null,2))}</pre></details></article>`).join('')||'<p>无匹配作品；请查看匹配状态。</p>'}document.querySelector('#year').oninput=list;document.querySelector('#sort').onchange=list;document.querySelector('#raw').onclick=()=>{document.querySelector('#list').innerHTML='<pre>'+esc(JSON.stringify({node:n,author:a},null,2))+'</pre>'};list()}svg.onwheel=e=>{e.preventDefault();let rect=svg.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,f=e.deltaY<0?1.15:1/1.15;offset.x=x-(x-offset.x)*f;offset.y=y-(y-offset.y)*f;offset.k*=f;transform()};let drag=null;svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){offset.x=drag.ox+e.clientX-drag.x;offset.y=drag.oy+e.clientY-drag.y;transform()}};svg.onpointerup=()=>drag=null;document.querySelector('#reset').onclick=()=>{offset.k=.5;center('computerscience:1446')};document.querySelector('#search').oninput=e=>{let q=e.target.value.toLowerCase();canvas.querySelectorAll('g').forEach(g=>g.style.opacity=D.nodes.find(n=>n.id===g.dataset.id).name.toLowerCase().includes(q)?1:.12);let n=D.nodes.find(n=>n.name.toLowerCase().includes(q));if(q&&n){center(n.id);show(n.id)}};document.querySelector('#count').textContent=`${D.nodes.length} 位作者 · ${D.works.length} 篇作品`;center(selected);show(selected);</script></html>
