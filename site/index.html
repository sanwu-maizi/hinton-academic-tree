<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hinton 学术谱系</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#24312f;background:#f4f7f6}header{height:64px;display:flex;align-items:center;gap:16px;padding:12px 20px;background:white;border-bottom:1px solid #cdd8d3}h1{font-size:19px;margin:0}input,select,button{padding:8px;border:1px solid #cdd8d3;background:white;border-radius:4px}main{display:flex;height:calc(100vh - 64px)}svg{flex:1;min-width:0;cursor:grab}aside{width:370px;overflow:auto;background:white;border-left:1px solid #cdd8d3;padding:20px}circle{cursor:pointer;stroke:white;stroke-width:2}text{font-size:12px;pointer-events:none}path{stroke:#a6b4b0;fill:none}article{padding:12px 0;border-top:1px solid #ddd}small{color:#61746a}.tabs{display:flex;gap:6px;flex-wrap:wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#176e61}@media(max-width:750px){header{height:auto;flex-wrap:wrap}main{height:85vh;flex-direction:column}svg{min-height:50vh}aside{width:100%;max-height:35vh}}</style>
<header><h1>Hinton 学术谱系</h1><input id="search" placeholder="搜索作者"><button id="reset">⌂</button><small id="count"></small></header><main><svg id="svg"><g id="canvas"></g></svg><aside id="panel"></aside></main>
<script src="d3.min.js"></script><script>async function readCompressed(url){
 const response=await fetch(url);if(!response.ok)throw new Error('HTTP '+response.status);
 const stream=response.body.pipeThrough(new DecompressionStream('gzip'));
 return JSON.parse(await new Response(stream).text());
}
(async()=>{try{const D=await readCompressed("graph.bin");const NS='http://www.w3.org/2000/svg',svg=document.querySelector('svg'),canvas=document.querySelector('#canvas'),panel=document.querySelector('#panel');const works=new Map(D.works.map(w=>[w.work_id,w])),authors=new Map(D.authors.map(a=>[a.node_id,a]));function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function el(tag,attrs,parent=canvas){let x=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>x.setAttribute(k,v));parent.appendChild(x);return x}let groups={},positions={},selected='computerscience:1446',offset={x:0,y:0,k:.5};D.nodes.forEach(n=>(groups[n.generation]??=[]).push(n));Object.entries(groups).forEach(([g,ns])=>ns.forEach((n,i)=>positions[n.id]={x:Number(g)*320,y:(i-(ns.length-1)/2)*110}));let maxC=Math.max(1,...D.authors.map(a=>a.works.reduce((s,id)=>s+(works.get(id)?.cited_by_count||0),0)));D.edges.forEach(e=>{let a=positions[e.source_id],b=positions[e.target_id];if(a&&b)el('path',{d:`M${a.x},${a.y} C${a.x+150},${a.y} ${b.x-150},${b.y} ${b.x},${b.y}`})});D.nodes.forEach(n=>{let a=authors.get(n.id),ids=a?.works||[],c=ids.reduce((s,id)=>s+(works.get(id)?.cited_by_count||0),0),p=positions[n.id],g=el('g',{'data-id':n.id}),r=9+Math.log1p(ids.length)*3;el('circle',{cx:p.x,cy:p.y,r,fill:a?.match_status==='matched'?`hsl(155 48% ${82-52*Math.log1p(c)/Math.log1p(maxC)}%)`:'#d7dad9'},g);el('text',{x:p.x+ r+7,y:p.y+4},g).textContent=n.name;g.onclick=()=>show(n.id);el('title',{},g).textContent=`${n.name} | ${ids.length}篇 | ${c}次引用`});function transform(){canvas.setAttribute('transform',`translate(${offset.x},${offset.y}) scale(${offset.k})`)}function center(id){let p=positions[id];offset.x=svg.clientWidth/2-p.x*offset.k;offset.y=svg.clientHeight/2-p.y*offset.k;transform()}function show(id){selected=id;let n=D.nodes.find(n=>n.id===id),a=authors.get(id),ws=(a?.works||[]).map(id=>works.get(id)).filter(Boolean);panel.innerHTML=`<h2>${esc(n.name)}</h2><p>${esc(n.institution||'机构未记录')}</p><p>${esc(n.tree)} · ${esc(a?.match_status||'未处理')}</p><p>已获取 ${ws.length} 篇 · 被引 ${ws.reduce((s,w)=>s+(w.cited_by_count||0),0)} 次</p><small>分页：${esc(a?.pagination_status||'未开始')}；谱系关系为网站培训关系，未全部核实为博士指导。</small><p><a href="${esc(n.url)}" target="_blank" rel="noopener">AcademicTree 来源</a></p><div class="tabs"><input id="year" type="number" placeholder="年份" style="width:100px"><select id="sort"><option value="cites">引用排序</option><option value="year">年份排序</option></select><button id="raw">全部字段</button></div><div id="list"></div>`;function list(){let year=document.querySelector('#year').value,sort=document.querySelector('#sort').value;document.querySelector('#list').innerHTML=ws.filter(w=>!year||String(w.publication_year)===year).sort((a,b)=>sort==='cites'?(b.cited_by_count||0)-(a.cited_by_count||0):(b.publication_year||0)-(a.publication_year||0)).map(w=>`<article><b>${esc(w.title)}</b><p>${esc(w.publication_year)} · 被引 ${w.cited_by_count||0}</p><small>${esc((w.authors||[]).join(', '))}</small><p>${esc(w.venue||'')}</p><details><summary>论文全部字段</summary><pre>${esc(JSON.stringify(w,null,2))}</pre></details></article>`).join('')||'<p>无匹配作品；请查看匹配状态。</p>'}document.querySelector('#year').oninput=list;document.querySelector('#sort').onchange=list;document.querySelector('#raw').onclick=()=>{document.querySelector('#list').innerHTML='<pre>'+esc(JSON.stringify({node:n,author:a},null,2))+'</pre>'};list()}svg.onwheel=e=>{e.preventDefault();let rect=svg.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,f=e.deltaY<0?1.15:1/1.15;offset.x=x-(x-offset.x)*f;offset.y=y-(y-offset.y)*f;offset.k*=f;transform()};let drag=null;svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y};svg.setPointerCapture(e.pointerId)};svg.onpointermove=e=>{if(drag){offset.x=drag.ox+e.clientX-drag.x;offset.y=drag.oy+e.clientY-drag.y;transform()}};svg.onpointerup=()=>drag=null;document.querySelector('#reset').onclick=()=>{offset.k=.5;center('computerscience:1446')};document.querySelector('#search').oninput=e=>{let q=e.target.value.toLowerCase();canvas.querySelectorAll('g').forEach(g=>g.style.opacity=D.nodes.find(n=>n.id===g.dataset.id).name.toLowerCase().includes(q)?1:.12);let n=D.nodes.find(n=>n.name.toLowerCase().includes(q));if(q&&n){center(n.id);show(n.id)}};document.querySelector('#count').textContent=`${D.nodes.length} 位作者 · ${D.works.length} 篇作品`;center(selected);
const originalShow=show,detailCache=new Map();let activeRequest=0;
show=async function(id){
 const requestId=++activeRequest;selected=id;
 const author=authors.get(id),node=D.nodes.find(n=>n.id===id);
 if(!author?.detail_url){originalShow(id);return}
 if(!detailCache.has(id)){
  panel.innerHTML='<h2>'+esc(node.name)+'</h2><p>'+esc(node.institution||'')+'</p><p role="status">正在加载论文…</p>';
  const pending=readCompressed(author.detail_url).then(detail=>{
   detail.works.forEach(w=>works.set(w.work_id,w));authors.set(id,detail.author);return detail;
  }).catch(error=>{detailCache.delete(id);throw error});detailCache.set(id,pending);
 }
 try{await detailCache.get(id);if(requestId===activeRequest)originalShow(id)}
 catch(error){if(requestId===activeRequest){panel.innerHTML='<h2>'+esc(node.name)+'</h2><p>论文加载失败，请重试。</p><button id="retry-detail">重试</button>';document.querySelector('#retry-detail').onclick=()=>show(id)}}
};

// Start pointer capture only after a drag, so node clicks keep their target.
const hoverTip=document.createElement('div');
hoverTip.className='hover-tip';document.body.appendChild(hoverTip);
const interactionStyle=document.createElement('style');
interactionStyle.textContent=`
.hover-tip{position:fixed;z-index:20;pointer-events:none;display:none;background:#fff;color:#24312f;border:1px solid #bdcec4;border-radius:5px;padding:10px 12px;box-shadow:0 4px 18px #24312f20;font-size:13px;max-width:260px}
#canvas>g{transition:opacity .16s}#canvas>g circle{transition:stroke .16s,filter .16s;vector-effect:non-scaling-stroke}
#canvas>g.is-related circle{stroke:#419e80;stroke-width:2.5}#canvas>g.is-current circle{stroke:#123f31;stroke-width:3;filter:drop-shadow(0 0 3px #419e8060)}
#canvas>path{transition:stroke .16s,opacity .16s;vector-effect:non-scaling-stroke}#canvas>path.is-related{stroke:#237557;stroke-width:2.5}
#svg{animation:gentle-float 7s ease-in-out infinite;touch-action:none}@keyframes gentle-float{0%,100%{transform:translateY(-.33px)}50%{transform:translateY(.33px)}}
@media(prefers-reduced-motion:reduce){#svg{animation:none}}
`;
document.head.appendChild(interactionStyle);
const nodeElements=new Map([...canvas.querySelectorAll('g[data-id]')].map(g=>[g.dataset.id,g]));
const edgeElements=[...canvas.querySelectorAll(':scope>path')];
const visibleEdges=D.edges.filter(e=>positions[e.source_id]&&positions[e.target_id]);
let hovered=null;
function highlight(id){
    const related=new Set([id]);
    visibleEdges.forEach(e=>{if(e.source_id===id||e.target_id===id){related.add(e.source_id);related.add(e.target_id)}});
    const query=document.querySelector('#search').value.toLowerCase();
    nodeElements.forEach((g,key)=>{
        g.classList.toggle('is-current',key===id);
        g.classList.toggle('is-related',!!id&&related.has(key)&&key!==id);
        const name=D.nodes.find(n=>n.id===key).name.toLowerCase();
        g.style.opacity=id?(related.has(key)?1:.22):(!query||name.includes(query)?1:.12);
    });
    edgeElements.forEach((path,i)=>{
        const e=visibleEdges[i],active=!!id&&(e.source_id===id||e.target_id===id);
        path.classList.toggle('is-related',active);path.style.opacity=id?(active?1:.12):1;
    });
}
function tipPosition(e){
    hoverTip.style.left=Math.max(8,Math.min(e.clientX+16,innerWidth-hoverTip.offsetWidth-8))+'px';
    hoverTip.style.top=Math.max(8,Math.min(e.clientY+16,innerHeight-hoverTip.offsetHeight-8))+'px';
}
nodeElements.forEach((g,id)=>{
    g.setAttribute('tabindex','0');g.setAttribute('role','button');
    const n=D.nodes.find(n=>n.id===id),a=authors.get(id),ids=a?.works||[];
    const citations=ids.reduce((sum,wid)=>sum+(works.get(wid)?.cited_by_count||0),0);
    g.setAttribute('aria-label',n.name);
    g.onpointerenter=e=>{
        hovered=id;highlight(id);
        hoverTip.innerHTML=`<b>${esc(n.name)}</b><br>论文数量：${a?.match_status==='matched'?ids.length.toLocaleString():'未匹配'}<br>引用数量：${a?.match_status==='matched'?citations.toLocaleString():'未匹配'}`;
        hoverTip.style.display='block';tipPosition(e);
    };
    g.onpointermove=e=>{if(hovered===id)tipPosition(e)};
    g.onpointerleave=()=>{hovered=null;hoverTip.style.display='none';highlight(null)};
    g.onclick=e=>{if(suppressClick){e.preventDefault();return}show(id);highlight(hovered)};
    g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(id);highlight(id)}};
});
let pointerDrag=null,suppressClick=false;
svg.onpointerdown=e=>{
    if(e.button!==0)return;
    pointerDrag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y,id:e.pointerId,moved:false};suppressClick=false;
};
svg.onpointermove=e=>{
    if(!pointerDrag)return;
    if(!pointerDrag.moved&&Math.hypot(e.clientX-pointerDrag.x,e.clientY-pointerDrag.y)>4){
        pointerDrag.moved=true;svg.setPointerCapture(e.pointerId);hoverTip.style.display='none';
    }
    if(pointerDrag.moved){offset.x=pointerDrag.ox+e.clientX-pointerDrag.x;offset.y=pointerDrag.oy+e.clientY-pointerDrag.y;transform()}
};
function finishPointer(){
    if(!pointerDrag)return;
    suppressClick=pointerDrag.moved;
    if(svg.hasPointerCapture(pointerDrag.id))svg.releasePointerCapture(pointerDrag.id);
    pointerDrag=null;setTimeout(()=>suppressClick=false,0);
}
svg.onpointerup=finishPointer;svg.onpointercancel=finishPointer;
highlight(selected);

// D3's force solver keeps genealogy columns while allowing local elastic motion.
svg.style.animation='none';svg.style.transform='none';
const forceStyle=document.createElement('style');
forceStyle.textContent=`#svg{animation:none!important}#canvas>g text{fill:#445b55;font-size:15px}#canvas>g circle{stroke:#aac4b8;stroke-width:1.3}#canvas>g.is-current circle{stroke:#134d3a;stroke-width:2.4}#canvas>path{stroke:#b3c9bf;stroke-width:1.2;opacity:1}#canvas>path.is-related{stroke:#377f65;stroke-width:1.8}`;
document.head.appendChild(forceStyle);
const forceNodes=D.nodes.map(n=>({...n,x:positions[n.id].x,y:positions[n.id].y,r:+nodeElements.get(n.id).querySelector('circle').getAttribute('r')}));
const forceById=new Map(forceNodes.map(n=>[n.id,n]));
forceNodes.forEach(n=>{const box=nodeElements.get(n.id).querySelector('text').getBBox();n.labelWidth=box.width;n.labelHeight=box.height});
// Resolve the whole circle-plus-label rectangle, rather than just the circle.
function labelCollision(){
 let nodes=[];
 function force(){
  for(let pass=0;pass<3;pass++)for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
   const a=nodes[i],b=nodes[j],pad=8;
   const ax=a.x+a.vx,ay=a.y+a.vy,bx=b.x+b.vx,by=b.y+b.vy;
   const ar=a.r*1.16,br=b.r*1.16;
   const left=Math.max(ax-ar-pad,bx-br-pad),right=Math.min(ax+ar+12+a.labelWidth+pad,bx+br+12+b.labelWidth+pad);
   const top=Math.max(ay-Math.max(ar,a.labelHeight/2)-pad,by-Math.max(br,b.labelHeight/2)-pad),bottom=Math.min(ay+Math.max(ar,a.labelHeight/2)+pad,by+Math.max(br,b.labelHeight/2)+pad);
   if(right<=left||bottom<=top)continue;
   const dx=right-left,dy=bottom-top;
   if(dy<dx){const push=(dy+.5)*.5*(ay<=by?-1:1);if(a.fy==null)a.vy+=push;if(b.fy==null)b.vy-=push}
   else{const push=(dx+.5)*.5*(ax<=bx?-1:1);if(a.fx==null)a.vx+=push;if(b.fx==null)b.vx-=push}
  }
 }
 force.initialize=value=>nodes=value;return force;
}
const forceLinks=visibleEdges.map(e=>({source:e.source_id,target:e.target_id}));
const simulation=d3.forceSimulation(forceNodes)
 .force('link',d3.forceLink(forceLinks).id(n=>n.id).distance(190).strength(.12))
 .force('charge',d3.forceManyBody().strength(-260))
 .force('collision',d3.forceCollide(n=>n.r+22).strength(.85))
 .force('labels',labelCollision())
 .force('column',d3.forceX(n=>n.generation*320).strength(.28))
 .force('row',d3.forceY(n=>positions[n.id].y*.65).strength(.035))
 .velocityDecay(.38).alphaDecay(.025);
function paintForce(){
 forceNodes.forEach(n=>{const g=nodeElements.get(n.id),c=g.querySelector('circle'),t=g.querySelector('text');c.setAttribute('cx',n.x);c.setAttribute('cy',n.y);t.setAttribute('x',n.x+n.r+7);t.setAttribute('y',n.y+4)});
 forceLinks.forEach((e,i)=>{const a=e.source,b=e.target;edgeElements[i].setAttribute('d',`M${a.x},${a.y} C${a.x+90},${a.y} ${b.x-90},${b.y} ${b.x},${b.y}`)});
}
simulation.on('tick',paintForce);
const previousHighlight=highlight;
highlight=function(id){
 previousHighlight(id);
 nodeElements.forEach((g,key)=>{g.style.opacity='1';const n=forceById.get(key),circle=g.querySelector('circle'),active=g.classList.contains('is-current'),related=g.classList.contains('is-related');circle.setAttribute('r',n.r*(active?1.16:related?1.08:1));g.querySelector('text').style.fill=active||related?'#203c30':'#536b60'});
 edgeElements.forEach(p=>p.style.opacity='1');
};
nodeElements.forEach((g,id)=>{
 const circle=g.querySelector('circle'),base=circle.getAttribute('fill');
 circle.setAttribute('fill',authors.get(id)?.match_status==='matched'?base:'#b8c4bd');
 g.addEventListener('pointerenter',()=>{simulation.alphaTarget(.035).restart()});
 g.addEventListener('pointerleave',()=>simulation.alphaTarget(0));
});
let forceDrag=null;
svg.onpointerdown=e=>{
 if(e.button!==0)return;const g=e.target.closest('g[data-id]');
 if(!g){pointerDrag={x:e.clientX,y:e.clientY,ox:offset.x,oy:offset.y,id:e.pointerId,moved:false};return}
 const n=forceById.get(g.dataset.id);forceDrag={n,x:e.clientX,y:e.clientY,ox:n.x,oy:n.y,id:e.pointerId,moved:false};suppressClick=false;
};
svg.onpointermove=e=>{
 if(forceDrag){const f=forceDrag;if(!f.moved&&Math.hypot(e.clientX-f.x,e.clientY-f.y)>4){f.moved=true;svg.setPointerCapture(e.pointerId);simulation.alphaTarget(.18).restart();hoverTip.style.display='none'}if(f.moved){f.n.fx=f.ox+(e.clientX-f.x)/offset.k;f.n.fy=f.oy+(e.clientY-f.y)/offset.k}return}
 if(pointerDrag){if(!pointerDrag.moved&&Math.hypot(e.clientX-pointerDrag.x,e.clientY-pointerDrag.y)>4){pointerDrag.moved=true;svg.setPointerCapture(e.pointerId)}if(pointerDrag.moved){offset.x=pointerDrag.ox+e.clientX-pointerDrag.x;offset.y=pointerDrag.oy+e.clientY-pointerDrag.y;transform()}}
};
svg.onpointerup=()=>{if(forceDrag){suppressClick=forceDrag.moved;forceDrag.n.fx=null;forceDrag.n.fy=null;if(svg.hasPointerCapture(forceDrag.id))svg.releasePointerCapture(forceDrag.id);forceDrag=null;simulation.alphaTarget(0);setTimeout(()=>suppressClick=false,0)}else finishPointer()};svg.onpointercancel=svg.onpointerup;
center=function(id){const n=forceById.get(id);offset.x=svg.clientWidth/2-n.x*offset.k;offset.y=svg.clientHeight/2-n.y*offset.k;transform()};
function fitGraph(){const xs=forceNodes.map(n=>n.x),ys=forceNodes.map(n=>n.y);const minX=Math.min(...xs)-100,maxX=Math.max(...xs)+240,minY=Math.min(...ys)-80,maxY=Math.max(...ys)+80;offset.k=Math.min(svg.clientWidth/(maxX-minX),svg.clientHeight/(maxY-minY),.8)*.92;offset.x=svg.clientWidth/2-(minX+maxX)/2*offset.k;offset.y=svg.clientHeight/2-(minY+maxY)/2*offset.k;transform()}
document.querySelector('#reset').onclick=fitGraph;
for(let i=0;i<160;i++)simulation.tick();paintForce();fitGraph();highlight(null);

requestAnimationFrame(()=>requestAnimationFrame(()=>show(selected)));
}catch(error){document.querySelector('#panel').textContent='图谱加载失败：'+error.message;}})();</script></html>
