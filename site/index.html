<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学术谱系 · Hinton / Dirac / Tao</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f6;color:#24312f;font:14px system-ui}nav{height:54px;display:flex;align-items:center;gap:6px;padding:0 16px;border-bottom:1px solid #cdd8d3;background:#fff}nav button{height:40px;padding:0 18px;border:0;border-bottom:3px solid transparent;background:none;color:#526b60;font:inherit;cursor:pointer}nav button[aria-selected=true]{color:#176e51;border-bottom-color:#237557;font-weight:600}#scope{height:35px;padding:8px 20px;font-size:12px;color:#526b60;border-bottom:1px solid #dbe4df}iframe{display:block;border:0;width:100%;height:calc(100dvh - 89px);background:#f4f7f6}iframe[hidden]{display:none}@media(max-width:600px){nav{padding:0 6px}nav button{padding:0 12px}#scope{height:50px;padding:6px 12px}iframe{height:calc(100dvh - 104px)}}</style></head>
<body><nav role="tablist" aria-label="学术谱系"><button id="tab-hinton" role="tab" aria-selected="true" aria-controls="tree-hinton" data-tree="hinton">Hinton</button><button id="tab-dirac" role="tab" aria-selected="false" aria-controls="tree-dirac" data-tree="dirac" tabindex="-1">Dirac</button><button id="tab-tao" role="tab" aria-selected="false" aria-controls="tree-tao" data-tree="tao" tabindex="-1">Tao</button></nav><div id="scope"></div><div id="views"></div>
<script>
const cases={hinton:{name:'Hinton',url:'trees/hinton/',note:'AcademicTree · 243 个节点 · 当前公开页面快照'},dirac:{name:'Paul Dirac',url:'trees/dirac/',note:'1933 年诺贝尔物理学奖 · AcademicTree · 138 个节点'},tao:{name:'Terence Tao',url:'trees/tao/',note:'2006 年菲尔兹奖 · MGP · 导师与直接学生共 27 个节点；仅 Tao 的作品已补全'}};
const frames=new Map(),buttons=[...document.querySelectorAll('[role=tab]')];
function select(key){if(!cases[key])key='hinton';if(!frames.has(key)){let frame=document.createElement('iframe');frame.id='tree-'+key;frame.title=cases[key].name+' 学术谱系';frame.setAttribute('role','tabpanel');frame.setAttribute('aria-labelledby','tab-'+key);frame.src=cases[key].url;document.querySelector('#views').appendChild(frame);frames.set(key,frame)}frames.forEach((frame,id)=>frame.hidden=id!==key);buttons.forEach(b=>{b.setAttribute('aria-selected',String(b.dataset.tree===key));b.tabIndex=b.dataset.tree===key?0:-1});document.querySelector('#scope').textContent=cases[key].note;history.replaceState(null,'','#'+key)}
buttons.forEach((button,index)=>{button.onclick=()=>select(button.dataset.tree);button.onkeydown=e=>{let target;if(e.key==='ArrowRight')target=(index+1)%buttons.length;if(e.key==='ArrowLeft')target=(index+buttons.length-1)%buttons.length;if(e.key==='Home')target=0;if(e.key==='End')target=buttons.length-1;if(target!==undefined){e.preventDefault();buttons[target].focus();select(buttons[target].dataset.tree)}}});window.addEventListener('hashchange',()=>select(location.hash.slice(1)));select(location.hash.slice(1)||'hinton');
</script></body></html>
